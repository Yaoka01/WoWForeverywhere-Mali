name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK
        run: |
          NDK=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;\" > /dev/null

      - name: Fetch runtime components
        run: tools/fetch_components.sh

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleModernDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Foreverywhere-Debug-Mali
          path: app/build/outputs/apk/modern/debug/app-modern-debug.apk
